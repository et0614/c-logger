<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-Logger — 温湿度・CO2 データロガー</title>
<meta name="description" content="ボタン電池1個で動く、26mm 角の温湿度・CO2 データロガー。USB でつないでブラウザから操作できます。">
<style>
  :root {
    --bg: #f5f6f4; --card: #ffffff; --ink: #1d2422; --sub: #5d6a66; --line: #d9dfdc;
    --accent: #0f7a5c; --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141917; --card: #1d2422; --ink: #e8eeeb; --sub: #9aa8a3; --line: #323c39;
      --accent: #3fbf96; --accent-ink: #0c1512;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.7 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 56px; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { font-weight: 700; letter-spacing: .02em; }
  button.small {
    font: inherit; font-size: 14px; padding: 4px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer;
  }
  .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: center; margin-top: 28px; }
  .hero h1 { font-size: 40px; line-height: 1.2; margin: 0 0 6px; letter-spacing: .01em; }
  .hero .kind { color: var(--accent); font-weight: 600; margin: 0 0 14px; }
  .hero p { margin: 0 0 20px; color: var(--sub); }
  .hero img { width: 100%; height: auto; border-radius: 12px; background: #fff; border: 1px solid var(--line); }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  a.btn {
    display: inline-block; padding: 10px 20px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); text-decoration: none;
  }
  a.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .hint { font-size: 14px; color: var(--sub); margin-top: 10px; }
  h2 { font-size: 21px; margin: 52px 0 16px; }
  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .features > div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .features h3 { font-size: 16px; margin: 0 0 4px; }
  .features p { margin: 0; color: var(--sub); font-size: 15px; }
  ol.steps { list-style: none; counter-reset: step; padding: 0; margin: 0; display: grid; gap: 12px; }
  ol.steps li {
    counter-increment: step; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 18px 14px 58px; position: relative;
  }
  ol.steps li::before {
    content: counter(step); position: absolute; left: 16px; top: 14px; width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; text-align: center; line-height: 28px;
  }
  ol.steps b { display: block; }
  ol.steps span { color: var(--sub); font-size: 15px; }
  table { border-collapse: collapse; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 16px; border-top: 1px solid var(--line); vertical-align: top; }
  tr:first-child th, tr:first-child td { border-top: 0; }
  th { font-weight: 400; color: var(--sub); width: 9.5em; white-space: nowrap; }
  footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--sub); font-size: 14px; display: flex; gap: 18px; flex-wrap: wrap; }
  footer a { color: var(--sub); }
  @media (max-width: 640px) {
    .hero { grid-template-columns: 1fr; }
    .hero h1 { font-size: 32px; }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="brand">C-Logger</span>
    <button id="langBtn" class="small"></button>
  </div>

  <div class="hero">
    <div>
      <h1>C-Logger</h1>
      <p class="kind" data-i18n="kind"></p>
      <p data-i18n="lead"></p>
      <div class="actions">
        <a class="btn primary" href="app/" data-i18n="open_app"></a>
        <a class="btn" href="manual.html" data-i18n="manual"></a>
      </div>
      <p class="hint" data-i18n="app_hint"></p>
    </div>
    <img src="images/3d_top.png" alt="C-Logger" width="1700" height="1260">
  </div>

  <h2 data-i18n="feat_title"></h2>
  <div class="features">
    <div><h3 data-i18n="f1_t"></h3><p data-i18n="f1_d"></p></div>
    <div><h3 data-i18n="f2_t"></h3><p data-i18n="f2_d"></p></div>
    <div><h3 data-i18n="f3_t"></h3><p data-i18n="f3_d"></p></div>
    <div><h3 data-i18n="f4_t"></h3><p data-i18n="f4_d"></p></div>
    <div><h3 data-i18n="f5_t"></h3><p data-i18n="f5_d"></p></div>
    <div><h3 data-i18n="f6_t"></h3><p data-i18n="f6_d"></p></div>
  </div>

  <h2 data-i18n="how_title"></h2>
  <ol class="steps">
    <li><b data-i18n="s1_t"></b><span data-i18n="s1_d"></span></li>
    <li><b data-i18n="s2_t"></b><span data-i18n="s2_d"></span></li>
    <li><b data-i18n="s3_t"></b><span data-i18n="s3_d"></span></li>
    <li><b data-i18n="s4_t"></b><span data-i18n="s4_d"></span></li>
  </ol>

  <h2 data-i18n="spec_title"></h2>
  <table>
    <tr><th data-i18n="sp_kind"></th><td data-i18n="sp_kind_v"></td></tr>
    <tr><th data-i18n="sp_sensor"></th><td data-i18n="sp_sensor_v"></td></tr>
    <tr><th data-i18n="sp_interval"></th><td data-i18n="sp_interval_v"></td></tr>
    <tr><th data-i18n="sp_mem"></th><td data-i18n="sp_mem_v"></td></tr>
    <tr><th data-i18n="sp_power"></th><td data-i18n="sp_power_v"></td></tr>
    <tr><th data-i18n="sp_usb"></th><td data-i18n="sp_usb_v"></td></tr>
    <tr><th data-i18n="sp_size"></th><td data-i18n="sp_size_v"></td></tr>
    <tr><th data-i18n="sp_soft"></th><td data-i18n="sp_soft_v"></td></tr>
  </table>

  <footer>
    <a href="app/" data-i18n="open_app"></a>
    <a href="manual.html" data-i18n="manual"></a>
  </footer>
</main>

<script>
"use strict";
const TEXT = {
  ja: {
    kind: "温湿度・CO2 データロガー",
    lead: "温度・湿度・CO2 濃度を一定間隔で記録する、26mm 角の小さなデータロガーです。ボタン電池1個で動き、記録したデータは USB でパソコンに取り出せます。",
    open_app: "操作ページを開く", manual: "取扱説明書",
    app_hint: "操作ページは、パソコンの Chrome または Edge で開いてください。インストールは不要です。",
    feat_title: "特長",
    f1_t: "ボタン電池1個で動く", f1_d: "CR2032 を1個入れるだけ。USB につないでいる間は USB から給電します。",
    f2_t: "置き場所を選ばない", f2_d: "基板は 26 × 26 mm。棚の上や機器のすき間にも置けます。",
    f3_t: "記録間隔は 1〜3600 秒", f3_d: "メモリは約275万件分。12秒間隔でも約1年分を保存できます（記録できる期間は電池の持ちにもよります）。",
    f4_t: "ブラウザから操作", f4_d: "USB でつないでページを開くだけ。ドライバもソフトのインストールも要りません。",
    f5_t: "CSV で保存", f5_d: "記録したデータは CSV ファイルに保存でき、表計算ソフトでそのまま開けます。",
    f6_t: "1台ずつ補正できる", f6_d: "温度・湿度・CO2 の補正係数と、時計のずれの補正を本体に保存できます。",
    how_title: "使い方",
    s1_t: "USB でパソコンにつなぐ", s1_d: "操作ページを開いて「接続」を押し、一覧から C-Logger を選びます。",
    s2_t: "記録を始める", s2_d: "記録間隔を入れて開始します。本体の時計はパソコンの時刻に合わせられます。",
    s3_t: "ケーブルを抜いて設置する", s3_d: "記録を始めると本体は USB から切り離されます。あとは電池で記録を続けます。",
    s4_t: "回収してデータを保存する", s4_d: "もう一度 USB でつなぐと記録が止まります。操作ページから CSV で保存します。",
    spec_title: "仕様",
    sp_kind: "種類", sp_kind_v: "CO2あり版（CO2・温度・湿度）／CO2なし版（温度・湿度）",
    sp_sensor: "センサ", sp_sensor_v: "温湿度: Sensirion SHT40　CO2: Sensirion STCC4（CO2あり版）",
    sp_interval: "記録間隔", sp_interval_v: "1〜3600 秒",
    sp_mem: "記録容量", sp_mem_v: "16MB（約275万件。12秒間隔で約1年分）。いっぱいになると記録を止めます",
    sp_power: "電源", sp_power_v: "CR2032 ×1、または USB 給電",
    sp_usb: "通信", sp_usb_v: "USB 2.0 Full Speed（仮想 COM ポート）、Type-C",
    sp_size: "外形", sp_size_v: "基板 26 × 26 mm",
    sp_soft: "ソフトウェア", sp_soft_v: "ブラウザ版の操作ページ（Chrome・Edge）、Windows 用の PC ツール",
  },
  en: {
    kind: "Temperature / humidity / CO2 data logger",
    lead: "A small 26 mm square data logger that records temperature, humidity and CO2 concentration at a fixed interval. It runs on a single coin cell, and the recorded data is transferred to a computer over USB.",
    open_app: "Open the control page", manual: "Manual (Japanese)",
    app_hint: "Open the control page in Chrome or Edge on a computer. Nothing needs to be installed.",
    feat_title: "Features",
    f1_t: "Runs on one coin cell", f1_d: "Just insert a CR2032. While connected over USB it is powered from USB.",
    f2_t: "Fits anywhere", f2_d: "The board is 26 × 26 mm, small enough for a shelf or a gap in equipment.",
    f3_t: "Interval from 1 to 3600 s", f3_d: "The memory holds about 2.75 million records: about one year even at a 12-second interval (how long it can log also depends on the battery).",
    f4_t: "Controlled from a browser", f4_d: "Plug it in over USB and open the page. No driver or software installation.",
    f5_t: "Save as CSV", f5_d: "Recorded data is saved as a CSV file that opens directly in a spreadsheet.",
    f6_t: "Per-unit correction", f6_d: "Correction coefficients for temperature, humidity and CO2, and a clock drift correction, are stored in the device.",
    how_title: "How to use",
    s1_t: "Connect to a computer over USB", s1_d: "Open the control page, press Connect and choose C-Logger from the list.",
    s2_t: "Start logging", s2_d: "Enter the logging interval and start. The logger's clock is set to the computer's time.",
    s3_t: "Unplug and place it", s3_d: "Once logging starts, the logger disconnects from USB and keeps recording on the battery.",
    s4_t: "Collect it and save the data", s4_d: "Plugging it in again stops the logging. Save the data as CSV from the control page.",
    spec_title: "Specifications",
    sp_kind: "Models", sp_kind_v: "With CO2 (CO2, temperature, humidity) / without CO2 (temperature, humidity)",
    sp_sensor: "Sensors", sp_sensor_v: "Temperature / humidity: Sensirion SHT40   CO2: Sensirion STCC4 (CO2 model)",
    sp_interval: "Logging interval", sp_interval_v: "1 to 3600 s",
    sp_mem: "Memory", sp_mem_v: "16 MB (about 2.75 million records; about one year at a 12-second interval). Logging stops when full",
    sp_power: "Power", sp_power_v: "One CR2032, or USB",
    sp_usb: "Interface", sp_usb_v: "USB 2.0 Full Speed (virtual COM port), Type-C",
    sp_size: "Size", sp_size_v: "Board 26 × 26 mm",
    sp_soft: "Software", sp_soft_v: "Browser control page (Chrome, Edge), PC tool for Windows",
  },
};

// 言語の選択は操作ページと共有する
let lang = "ja";
try {
  lang = localStorage.getItem("clogger_lang") || (navigator.language.startsWith("ja") ? "ja" : "en");
} catch (e) {
  lang = navigator.language.startsWith("ja") ? "ja" : "en";
}
if (!TEXT[lang]) lang = "ja";

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = TEXT[lang][el.dataset.i18n]; });
  document.getElementById("langBtn").textContent = lang === "ja" ? "English" : "日本語";
}
document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "ja" ? "en" : "ja";
  try { localStorage.setItem("clogger_lang", lang); } catch (e) {}
  render();
});
render();
</script>
</body>
</html>
