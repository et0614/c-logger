<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-Logger 操作ページ</title>
<style>
  :root {
    --bg: #f5f6f4; --card: #ffffff; --ink: #1d2422; --sub: #5d6a66; --line: #d9dfdc;
    --accent: #0f7a5c; --accent-ink: #ffffff; --warn: #a8480f; --warn-bg: #fdf1e7; --ok-bg: #e8f5ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141917; --card: #1d2422; --ink: #e8eeeb; --sub: #9aa8a3; --line: #323c39;
      --accent: #3fbf96; --accent-ink: #0c1512; --warn: #f0a26b; --warn-bg: #33241a; --ok-bg: #1b2f28;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 26px; margin: 0; letter-spacing: .02em; }
  h1 a { color: inherit; text-decoration: none; }
  .head-links { display: flex; align-items: center; gap: 14px; font-size: 14px; }
  .head-links a { color: var(--sub); }
  .lead { color: var(--sub); margin: 4px 0 20px; font-size: 14px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-top: 16px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  h3 { font-size: 15px; margin: 22px 0 10px; padding-top: 16px; border-top: 1px solid var(--line); }
  button {
    font: inherit; padding: 9px 18px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.small { padding: 4px 12px; font-size: 14px; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=number], select {
    font: inherit; width: 7.5em; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink);
  }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .row + .row { margin-top: 12px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px; margin: 0; }
  dt { color: var(--sub); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  .note { color: var(--sub); font-size: 14px; margin: 10px 0 0; }
  .msg { border-radius: 8px; padding: 10px 14px; margin-top: 16px; font-size: 15px; }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg.ok { background: var(--ok-bg); }
  progress { width: 100%; height: 10px; margin-top: 12px; }
  [hidden] { display: none !important; }

  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 20px; border-bottom: 1px solid var(--line); }
  .tab { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 8px 14px; color: var(--sub); }
  .tab[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .panel { margin-top: 0; border-top: 0; border-radius: 0 0 10px 10px; }

  .live { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 14px; }
  .live > div { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .live .label { color: var(--sub); font-size: 14px; }
  .live .value { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.3; }
  .live .unit { font-size: 15px; font-weight: 400; color: var(--sub); margin-left: 4px; }
  .live svg { width: 100%; height: 44px; display: block; margin-top: 6px; }
  .live polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }

  table.coef { border-collapse: collapse; }
  table.coef th { text-align: left; font-weight: 400; color: var(--sub); padding: 4px 14px 4px 0; font-size: 14px; }
  table.coef td { padding: 4px 14px 4px 0; }
  pre.result { margin: 12px 0 0; padding: 10px 14px; background: var(--bg); border-radius: 8px; font: 14px/1.7 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <header>
    <h1><a href="../">C-Logger</a></h1>
    <div class="head-links">
      <a href="../" data-i18n="about"></a>
      <a href="../manual.html" target="_blank" rel="noopener" data-i18n="manual"></a>
      <button id="langBtn" class="small"></button>
    </div>
  </header>
  <p class="lead" data-i18n="lead"></p>

  <div id="unsupported" class="msg warn" hidden data-i18n="unsupported"></div>

  <section id="connectBox">
    <div class="row">
      <button id="connectBtn" class="primary"></button>
      <span id="connState"></span>
    </div>
  </section>

  <div id="message" class="msg" hidden></div>

  <div id="app" hidden>
    <section>
      <h2 data-i18n="info_title"></h2>
      <dl>
        <dt data-i18n="info_id"></dt><dd id="iId"></dd>
        <dt data-i18n="info_fw"></dt><dd id="iFw"></dd>
        <dt data-i18n="info_sensor"></dt><dd id="iSensor"></dd>
        <dt data-i18n="info_now"></dt><dd id="iNow"></dd>
        <dt data-i18n="info_count"></dt><dd id="iCount"></dd>
        <dt data-i18n="info_period"></dt><dd id="iPeriod"></dd>
        <dt data-i18n="info_batt"></dt><dd id="iBatt"></dd>
      </dl>
    </section>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="log" data-i18n="tab_log"></button>
      <button class="tab" role="tab" data-tab="data" data-i18n="tab_data"></button>
      <button class="tab" role="tab" data-tab="live" data-i18n="tab_live"></button>
      <button class="tab" role="tab" data-tab="calib" data-i18n="tab_calib"></button>
      <button class="tab" role="tab" data-tab="clock" data-i18n="tab_clock"></button>
      <button class="tab" role="tab" data-tab="diag" data-i18n="tab_diag"></button>
    </div>

    <!-- 記録 -->
    <section class="panel" data-panel="log">
      <div class="row">
        <label for="interval" data-i18n="log_interval"></label>
        <input id="interval" type="number" min="1" max="3600" step="1" value="60">
        <span data-i18n="sec"></span>
        <span id="capacity" class="note" style="margin:0"></span>
      </div>
      <div class="row"><button id="startBtn" class="primary" data-i18n="log_start"></button></div>
      <p class="note" data-i18n="log_note"></p>
      <p class="note" data-i18n="batt_note"></p>
    </section>

    <!-- データ -->
    <section class="panel" data-panel="data" hidden>
      <div class="row">
        <button id="saveBtn" class="primary" data-i18n="data_save"></button>
        <button id="eraseBtn" data-i18n="data_erase"></button>
        <span id="saveState"></span>
      </div>
      <progress id="saveProg" value="0" max="1" hidden></progress>
      <p class="note" data-i18n="data_note"></p>
    </section>

    <!-- ライブ表示 -->
    <section class="panel" data-panel="live" hidden>
      <div class="row">
        <button id="liveBtn" class="primary"></button>
        <span class="note" style="margin:0" data-i18n="live_note"></span>
      </div>
      <div class="live">
        <div><div class="label" data-i18n="temp"></div><div class="value"><span id="lvT">—</span><span class="unit">℃</span></div><svg id="spT" viewBox="0 0 200 40" preserveAspectRatio="none"><polyline/></svg></div>
        <div><div class="label" data-i18n="hum"></div><div class="value"><span id="lvH">—</span><span class="unit">%</span></div><svg id="spH" viewBox="0 0 200 40" preserveAspectRatio="none"><polyline/></svg></div>
        <div id="lvCbox"><div class="label">CO2</div><div class="value"><span id="lvC">—</span><span class="unit">ppm</span></div><svg id="spC" viewBox="0 0 200 40" preserveAspectRatio="none"><polyline/></svg></div>
      </div>
    </section>

    <!-- 校正 -->
    <section class="panel" data-panel="calib" hidden>
      <h2 data-i18n="corr_title"></h2>
      <p class="note" style="margin:0 0 10px" data-i18n="corr_formula"></p>
      <table class="coef">
        <tr><th></th><th>a</th><th>b</th></tr>
        <tr><td data-i18n="temp"></td><td><input id="cTa" type="number" step="0.00001"></td><td><input id="cTb" type="number" step="0.01"> ℃</td></tr>
        <tr><td data-i18n="hum"></td><td><input id="cHa" type="number" step="0.00001"></td><td><input id="cHb" type="number" step="0.01"> %</td></tr>
        <tr id="cCrow"><td>CO2</td><td><input id="cCa" type="number" step="0.00001"></td><td><input id="cCb" type="number" step="0.01"> ppm</td></tr>
      </table>
      <div class="row" style="margin-top:14px">
        <button id="corrSaveBtn" class="primary" data-i18n="corr_save"></button>
        <button id="corrResetBtn" data-i18n="corr_reset"></button>
      </div>
      <p class="note" data-i18n="corr_note"></p>

      <div id="frcBox">
        <h3 data-i18n="frc_title"></h3>
        <div class="row">
          <label for="frcPpm" data-i18n="frc_ref"></label>
          <input id="frcPpm" type="number" min="300" max="5000" step="1" value="420"> ppm
          <button id="frcBtn" class="primary"></button>
        </div>
        <progress id="frcProg" value="0" max="40" hidden></progress>
        <pre id="frcResult" class="result" hidden></pre>
        <p class="note" data-i18n="frc_note"></p>
      </div>
    </section>

    <!-- 時計 -->
    <section class="panel" data-panel="clock" hidden>
      <dl><dt data-i18n="clock_cur"></dt><dd id="clockCur"></dd></dl>
      <div class="row" style="margin-top:14px">
        <label for="clockMin" data-i18n="clock_dur"></label>
        <select id="clockMin">
          <option value="10">10</option><option value="30">30</option><option value="60" selected>60</option><option value="120">120</option>
        </select>
        <span data-i18n="min"></span>
        <button id="clockBtn" class="primary"></button>
      </div>
      <progress id="clockProg" value="0" max="1" hidden></progress>
      <pre id="clockResult" class="result" hidden></pre>
      <div class="row" style="margin-top:14px">
        <button id="clockApplyBtn" data-i18n="clock_apply" disabled></button>
        <button id="clockResetBtn" data-i18n="clock_reset"></button>
      </div>
      <p class="note" data-i18n="clock_note"></p>
    </section>

    <!-- 診断 -->
    <section class="panel" data-panel="diag" hidden>
      <div class="row"><button id="diagBtn" class="primary" data-i18n="diag_run"></button></div>
      <pre id="diagResult" class="result" hidden></pre>
      <p class="note" data-i18n="diag_note"></p>
    </section>
  </div>
</main>

  lang = localStorage.getItem("clogger_lang") || (navigator.language.startsWith("ja") ? "ja" : "en");
} catch (e) {
  lang = navigator.language.startsWith("ja") ? "ja" : "en";

if (!TEXT[lang]) lang = "ja";

function t(key, vars) {
  let s = TEXT[lang][key];
  if (s === undefined) s = key;
  if (vars) for (const k in vars) s = s.split(`{${k}}`).join(String(vars[k]));
  return s;
}

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const nowSec = () => (performance.timeOrigin + performance.now()) / 1000;   // PC の時刻 [秒] (小数つき)

// ------------------------------------------------------------
// 通信 (USB-CDC / JSON 1行=1コマンド。dump の本体だけバイナリ)
// ------------------------------------------------------------
const USB_FILTER = { usbVendorId: 0x04D8, usbProductId: 0x0B15 };   // K-Logger と共通。hello の device 名で確かめる
const DEVICE_NAME = "C-Logger";
const REC_SIZE = 6;            // int16 温度[℃×100], uint16 湿度[%×100], uint16 CO2[ppm] (little-endian)
const CO2_INVALID = 0xFFFF;    // 計測失敗 (欠測)
const CO2_NONE = 0xFFFE;       // CO2なし版 (温湿度は有効)
const DUMP_CHUNK = 10000;      // dump_range 1回あたりのレコード数
const FRC_SAMPLES = 40;        // CO2 の校正の前の計測回数 (STCC4 は 30 回以上必要)

class DeviceError extends Error {
  constructor(message, code) { super(message); this.code = code; }
}

class CLogger {
  constructor(port) {
    this.port = port;
    this.buf = new Uint8Array(0);   // 受信済みで未処理のバイト
    this.wake = null;               // 受信を待っている処理を起こす関数
    this.closed = false;
    this.id = 0;
  }

  async open() {
    await this.port.open({ baudRate: 115200 });   // USB-CDC なのでボーレートは使われない
    this.writer = this.port.writable.getWriter();
    this.reader = this.port.readable.getReader();
    this.pump = this._pump();
    await sleep(200);
    this.buf = new Uint8Array(0);                 // 接続前に溜まっていた分を捨てる
  }

  async _pump() {
    try {
      for (;;) {
        const { value, done } = await this.reader.read();
        if (done) break;
        if (value && value.length) {
          const merged = new Uint8Array(this.buf.length + value.length);
          merged.set(this.buf); merged.set(value, this.buf.length);
          this.buf = merged;
          if (this.wake) this.wake();
        }
      }
    } catch (e) {
      // 抜かれた、または本体が USB から切り離れた
    }
    this.closed = true;
    if (this.wake) this.wake();
  }

  async close() {
    this.closed = true;
    try { await this.reader.cancel(); } catch (e) {}
    try { await this.pump; } catch (e) {}
    try { this.reader.releaseLock(); } catch (e) {}
    try { this.writer.releaseLock(); } catch (e) {}
    try { await this.port.close(); } catch (e) {}
  }

  // 新しいデータが届くか、時間切れまで待つ。届いたら true
  _waitData(ms) {
    return new Promise((resolve) => {
      const timer = setTimeout(() => { this.wake = null; resolve(false); }, ms);
      this.wake = () => { clearTimeout(timer); this.wake = null; resolve(true); };
    });
  }

  _take(n) {
    const out = this.buf.slice(0, n);
    this.buf = this.buf.slice(n);
    return out;
  }

  // JSON の行を1つ読む。'{' で始まらない行は読み飛ばす。時間切れなら null
  async _readJsonLine(ms) {
    const deadline = Date.now() + ms;
    for (;;) {
      const nl = this.buf.indexOf(0x0A);
      if (nl >= 0) {
        const line = new TextDecoder().decode(this._take(nl + 1)).trim();
        if (line.startsWith("{")) {
          try { return JSON.parse(line); } catch (e) { return null; }
        }
        continue;
      }
      const left = deadline - Date.now();
      if (left <= 0 || this.closed) return null;
      await this._waitData(left);
    }
  }

  async _send(command, params) {
    if (this.closed) throw new Error(t("lost"));
    const req = { id: ++this.id, command };
    if (params !== undefined) req.params = params;
    await this.writer.write(new TextEncoder().encode(JSON.stringify(req) + "\n"));
    return this.id;
  }

  // コマンドを送って応答を返す。応答が無い・エラー応答なら例外
  async request(command, params, waitMs = 3000) {
    const rid = await this._send(command, params);
    for (;;) {
      const j = await this._readJsonLine(waitMs);
      if (j === null) throw new Error(this.closed ? t("lost") : t("no_response", { cmd: command }));
      if (j.id === rid) {
        if (!j.ok && j.error) {
          const friendly = TEXT[lang]["e_" + j.error];
          throw new DeviceError(friendly || `${command}: ${j.error}`, j.error);
        }
        return j;
      }
    }
  }

  // レコード [start, start+count) を生のバイト列で受け取る。onBytes(受信済みバイト数) を随時呼ぶ
  async dumpRange(start, count, onBytes) {
    const rid = await this._send("dump_range", { start, count });
    const hdr = await this._readJsonLine(5000);
    if (!hdr || hdr.id !== rid || hdr.dump !== "begin") throw new Error(t("dump_header"));
    const size = hdr.rec_size || REC_SIZE;
    const total = hdr.count * size;
    const raw = new Uint8Array(total);
    let got = 0;
    while (got < total) {
      if (this.buf.length === 0) {
        if (this.closed || !(await this._waitData(6000))) break;
        continue;
      }
      const part = this._take(Math.min(this.buf.length, total - got));
      raw.set(part, got);
      got += part.length;
      if (onBytes) onBytes(got);
    }
    if (got < total) throw new Error(t("dump_short", { a: got, b: total }));
    await this._readJsonLine(3000);   // フッタ
    return { hdr, raw, size };
  }

  // 本体の時計 (epoch) が1秒進む瞬間の PC の時刻を推定する。[新しい epoch, PC の時刻]
  async epochTransition(timeoutMs = 3000) {
    const poll = async () => {
      const t0 = nowSec();
      const e = (await this.request("get_status")).epoch;
      return [e, (t0 + nowSec()) / 2];
    };
    let [e0, tPrev] = await poll();
    const deadline = Date.now() + timeoutMs;
    while (Date.now() < deadline) {
      const [e, tm] = await poll();
      if (e !== e0) return [e, (tPrev + tm) / 2];   // 変わる前の最後の読みと、変わった後の最初の読みの中間
      tPrev = tm;
    }
    throw new Error(t("clock_stuck"));
  }
}

// ------------------------------------------------------------
// 値の変換と表示
// ------------------------------------------------------------
// 補正 (補正後 = a × 補正前 + b)。係数は本体に保存されていて、読み出し時にここで適用する
function makeCorrection(resp) {
  const coef = {};
  for (const k of ["temp", "hum", "co2"]) {
    coef[k] = resp && resp[k] ? [Number(resp[k].a), Number(resp[k].b)] : [1, 0];
  }
  return {
    coef,
    apply(key, raw) {
      if (raw === null) return null;
      const v = coef[key][0] * raw + coef[key][1];
      if (key === "hum") return Math.min(100, Math.max(0, v));
      if (key === "co2") return Math.max(0, Math.round(v));
      return v;
    },
  };
}

// (epoch, PC の時刻) の列に epoch = a + b·t を当てはめ、ずれ (b−1)×1e6 [ppm] と標準誤差を返す
function fitPpm(pts) {
  const n = pts.length;
  const ts = pts.map((p) => p[1] - pts[0][1]), es = pts.map((p) => p[0] - pts[0][0]);
  const mt = ts.reduce((a, b) => a + b, 0) / n, me = es.reduce((a, b) => a + b, 0) / n;
  let sxx = 0, sxy = 0;
  for (let i = 0; i < n; i++) { sxx += (ts[i] - mt) ** 2; sxy += (ts[i] - mt) * (es[i] - me); }
  const b = sxy / sxx, a = me - b * mt;
  let err = NaN;
  if (n > 2) {
    let res = 0;
    for (let i = 0; i < n; i++) res += (es[i] - (a + b * ts[i])) ** 2;
    err = Math.sqrt(res / (n - 2) / sxx) * 1e6;
  }
  return [(b - 1) * 1e6, err];
}

const pad = (n) => String(n).padStart(2, "0");
function fmtTime(epoch, compact = false) {
  const d = new Date(epoch * 1000);
  const ymd = [d.getFullYear(), pad(d.getMonth() + 1), pad(d.getDate())];
  const hms = [pad(d.getHours()), pad(d.getMinutes()), pad(d.getSeconds())];
  return compact ? `${ymd.join("")}_${hms.join("")}` : `${ymd.join("-")} ${hms.join(":")}`;
}

function fmtDuration(sec) {
  if (sec >= 2 * 86400) return t("dur_days", { v: (sec / 86400).toFixed(sec >= 20 * 86400 ? 0 : 1) });
  if (sec >= 2 * 3600) return t("dur_hours", { v: (sec / 3600).toFixed(1) });
  return t("dur_min", { v: Math.max(1, Math.round(sec / 60)) });
}

const signed = (v, digits) => (v >= 0 ? "+" : "") + v.toFixed(digits);

function showMessage(text, kind) {

  m.hidden = false;

// 操作中はほかのボタンと入力を止める。keep に渡したボタン (停止ボタン) だけは押せるままにする
function setBusy(on, keep) {
  busy = on;
  document.querySelectorAll("#connectBox button, #app button, #app input, #app select").forEach((el) => {
    el.disabled = on && el !== keep;
  });
  if (!on) updateEnabled();
}

function updateEnabled() {
  if (!info) return;
  const n = info.status.count;
  $("saveBtn").disabled = n === 0;
  $("eraseBtn").disabled = n === 0;

function selectTab(name) {

}

// 言語に依存する表示をすべて描き直す

function renderInfo() {
  if (!info) return;
  const { hello, id, status, batt, corr, now, hasCo2 } = info;
  $("iId").textContent = id;
  $("iFw").textContent = hello.fw;
  $("iSensor").textContent = now === null ? t("sensor_ng") : (hasCo2 ? t("sensor_co2") : t("sensor_th"));
  if (now) {
    const tv = corr.apply("temp", now.temp_C), hv = corr.apply("hum", now.hum_pct);
    const cv = now.co2_ppm === null ? null : corr.apply("co2", now.co2_ppm);

  } else {

  }

// 電池の持ちの見積もり (新品の CR2032)。消費電流は実測値 (リポジトリの TECHNICAL.md「消費電流の実測」) に基づく。
//   CO2あり版: 常時 41uA、毎秒計測中は平均 1026uA (計測1回あたり 985uC)。1件につき末尾5秒を毎秒測る。
//              記録開始から1時間は暖機で、記録間隔によらず毎秒測る。
//   CO2なし版: 常時 33uA、計測1回あたり 30uC (電流計の誤差が大きいので多めに見た値)。
//              FW 3.4.3 以降は1件につき1回、それより前は CO2あり版と同じ5回。
// 実測をそのまま信じると危ないので、消費電流に BATT_MARGIN を掛けて短めに出す。
const BATT_CAPACITY_MAH = 200;   // CR2032 の公称 220mAh を、2.0V で止めることを見込んで控えめに
const BATT_MARGIN = 1.5;

function fwAtLeast(fw, major, minor, patch) {
  const v = String(fw).split(".").map(Number);
  const w = [major, minor, patch];
  for (let i = 0; i < 3; i++) {
    if ((v[i] || 0) !== w[i]) return (v[i] || 0) > w[i];
  }
  return true;
}

// 記録間隔 sec [秒] で、新品の電池が何秒もつか
function batteryLifeSec(sec) {
  const co2 = info.hasCo2 !== false;   // 判定できなかったときは、消費の多い CO2あり版として見積もる
  const base = co2 ? 41 : 33;                       // 常時流れる分 [uA]
  const shot = co2 ? 985 : 30;                      // 計測1回の電荷 [uC]
  const shots = (co2 || !fwAtLeast(info.hello.fw, 3, 4, 3)) ? Math.min(5, sec) : 1;   // 1件あたりの計測回数
  const avg = (base + shot * shots / sec) * BATT_MARGIN;       // 平均電流 [uA]
  let capacity = BATT_CAPACITY_MAH;
  if (co2) {
    // 暖機の1時間は毎秒計測になる。その間に余分に使う分を容量から引く
    const warm = (base + shot) * BATT_MARGIN;
    capacity -= Math.max(0, warm - avg) / 1000;
  }
  return capacity / (avg / 1000) * 3600;
}

function updateCapacity() {
  const sec = Number($("interval").value);
  if (!info || !(sec >= 1 && sec <= 3600)) { $("capacity").textContent = ""; return; }
  const mem = info.status.capacity * sec, batt = batteryLifeSec(sec);
  // メモリのほうは、電池より先に尽きそうなとき (電池の持ちの3倍未満) だけ出す
  $("capacity").textContent = t("batt_life", { d: fmtDuration(batt) }) +
    (mem < batt * 3 ? " ／ " + t("mem_life", { d: fmtDuration(mem) }) : "") +
    (mem < batt ? "　" + t("limit_mem") : "");
}

function fillCorrectionInputs() {
  const c = info.corr.coef;
  $("cTa").value = c.temp[0]; $("cTb").value = c.temp[1];
  $("cHa").value = c.hum[0];  $("cHb").value = c.hum[1];
  $("cCa").value = c.co2[0];  $("cCb").value = c.co2[1];
}

// 例外の表示用の文言。接続が切れた後の例外は、原因をそのまま「接続が切れました」とする
const errText = (e) => ((!dev || dev.closed) ? t("lost") : e.message);

// 接続が切れていたら画面を切断の表示に戻す。切れていたら true
async function dropIfLost() {
  if (dev && dev.closed) { await disconnect(); return true; }
  return false;
}

// ------------------------------------------------------------
// 接続
// ------------------------------------------------------------
async function readInfo() {
  const hello = await dev.request("hello");
  if (hello.device !== DEVICE_NAME) throw new Error(t("not_clogger"));
  const id = (await dev.request("get_id")).device_id;
  const status = await dev.request("get_status");
  const batt = await dev.request("get_battery");
  const corr = makeCorrection(await dev.request("get_correction"));
  let clockPpm = null;
  try { clockPpm = (await dev.request("get_clock_calib")).ppm; } catch (e) { /* 古いファームウェア */ }
  let now = null;
  try { now = await dev.request("measure"); } catch (e) { /* センサの異常は表示で知らせる */ }
  info = { hello, id, status, batt, corr, clockPpm, now, hasCo2: now ? now.co2_ppm !== null : null };
}

async function refreshStatus() {
  info.status = await dev.request("get_status");
  renderInfo();
}

async function disconnect() {
  const d = dev;
  dev = null; info = null; running = null; stopReq = true; clockNew = null;
  if (d) await d.close();
  $("app").hidden = true;
  setBusy(false);
  render();
}

async function connect() {
  showMessage("");
  // 前に許可した機器が1台だけ見つかれば、選択画面を出さずにそれを使う
  let port = null;
  const known = (await navigator.serial.getPorts()).filter((p) => {
    const i = p.getInfo();
    return i.usbVendorId === USB_FILTER.usbVendorId && i.usbProductId === USB_FILTER.usbProductId;
  });
  if (known.length === 1) port = known[0];
  if (!port) {
    try {
      port = await navigator.serial.requestPort({ filters: [USB_FILTER] });
    } catch (e) {
      return;   // 選択画面を閉じた
    }
  }
  setBusy(true);
  $("connState").textContent = t("connecting");
  try {
    dev = new CLogger(port);
    await dev.open();
    await readInfo();
    const iv = info.status.interval;
    $("interval").value = iv >= 1 && iv <= 3600 ? iv : 60;
    fillCorrectionInputs();
    for (const id of ["frcResult", "clockResult", "diagResult"]) $(id).hidden = true;
    for (const id of ["lvT", "lvH", "lvC"]) $(id).textContent = "—";
    liveHist = { T: [], H: [], C: [] };
    drawSparks();
    $("saveState").textContent = "";
    selectTab("log");
    $("app").hidden = false;
    setBusy(false);
    render();
  } catch (e) {
    const msg = e.message;
    await disconnect();
    showMessage(t("conn_failed", { e: msg }), "warn");
  }
}

// ------------------------------------------------------------
// 記録・データ
// ------------------------------------------------------------
async function startLogging() {
  const sec = Number($("interval").value);
  if (!Number.isInteger(sec) || sec < 1 || sec > 3600) { showMessage(t("interval_bad"), "warn"); return; }
  const n = info.status.count;
  const ask = (n > 0 ? t("start_confirm_erase", { n: n.toLocaleString() }) : "") + t("start_confirm", { s: sec });
  if (!confirm(ask)) return;

  const co2 = info.hasCo2;
  setBusy(true);
  showMessage(n > 0 ? t("erasing") : t("starting"), "ok");
  try {
    await dev.request("clear_memory", undefined, 300000);
    await dev.request("set_interval", { sec });
    await dev.request("set_time", { epoch: Math.floor(Date.now() / 1000) });
    await dev.request("start_logging");
    await disconnect();
    showMessage(t("started") + (co2 ? t("started_co2") : "") + t("started_read"), "ok");
  } catch (e) {
    showMessage(t("start_failed", { e: errText(e) }), "warn");
    await dropIfLost();
    setBusy(false);
  }
}

async function saveCsv() {
  setBusy(true);
  showMessage("");
  const prog = $("saveProg");
  try {
    const status = await dev.request("get_status");
    const total = status.count;
    if (total === 0) throw new Error(t("no_data"));
    prog.max = total; prog.value = 0; prog.hidden = false;

    const f2 = (v) => (v === null ? "" : v.toFixed(2));
    const f0 = (v) => (v === null ? "" : String(v));
    const parts = ["index,epoch,datetime,temp_C,hum_pct,co2_ppm,temp_raw_C,hum_raw_pct,co2_raw_ppm\r\n"];
    let startDt = status.start_dt, interval = status.interval, failed = 0;

    for (let start = 0; start < total; start += DUMP_CHUNK) {
      const cnt = Math.min(DUMP_CHUNK, total - start);
      const { hdr, raw, size } = await dev.dumpRange(start, cnt, (bytes) => {
        const done = start + Math.floor(bytes / REC_SIZE);
        prog.value = done;
        $("saveState").textContent = t("reading", { a: done.toLocaleString(), b: total.toLocaleString() });
      });
      startDt = hdr.start_dt; interval = hdr.interval;
      const view = new DataView(raw.buffer);
      const lines = [];
      for (let i = 0; i < hdr.count; i++) {
        const o = i * size;
        const co2raw = view.getUint16(o + 4, true);
        let tv = null, hv = null, cv = null;
        if (co2raw === CO2_INVALID) {
          failed++;
        } else {
          tv = view.getInt16(o, true) / 100;
          hv = view.getUint16(o + 2, true) / 100;
          cv = co2raw === CO2_NONE ? null : co2raw;
        }
        const idx = start + i, ts = startDt + idx * interval;
        lines.push([idx, ts, fmtTime(ts),
          f2(info.corr.apply("temp", tv)), f2(info.corr.apply("hum", hv)), f0(info.corr.apply("co2", cv)),
          f2(tv), f2(hv), f0(cv)].join(","));
      }
      parts.push(lines.join("\r\n") + "\r\n");
    }

    const name = `clogger_${info.id}_${fmtTime(startDt, true)}.csv`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(parts, { type: "text/csv" }));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    showMessage(t("saved", { n: total.toLocaleString(), f: name }) +
      (failed > 0 ? t("saved_failed", { n: failed }) : ""), "ok");
  } catch (e) {
    showMessage(t("save_failed", { e: errText(e) }), "warn");
    if (await dropIfLost()) return;
  }
  $("saveState").textContent = "";
  prog.hidden = true;
  setBusy(false);
}

async function eraseData() {
  if (!confirm(t("erase_confirm", { n: info.status.count.toLocaleString() }))) return;
  setBusy(true);
  showMessage(t("erasing"), "ok");
  try {
    await dev.request("clear_memory", undefined, 300000);
    await refreshStatus();
    showMessage(t("erased"), "ok");
  } catch (e) {
    showMessage(t("erase_failed", { e: errText(e) }), "warn");
    if (await dropIfLost()) return;
  }
  setBusy(false);
}

// ------------------------------------------------------------
// ライブ表示
// ------------------------------------------------------------
const LIVE_KEEP = 300;   // グラフに残す点数 (約5分)
let liveHist = { T: [], H: [], C: [] };

function drawSpark(svg, values) {
  const line = svg.querySelector("polyline");
  if (values.length < 2) { line.setAttribute("points", ""); return; }
  let lo = Math.min(...values), hi = Math.max(...values);
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const step = 200 / (LIVE_KEEP - 1), x0 = 200 - step * (values.length - 1);
  line.setAttribute("points", values.map((v, i) =>
    `${(x0 + i * step).toFixed(1)},${(38 - 36 * (v - lo) / (hi - lo)).toFixed(1)}`).join(" "));
}

function drawSparks() {
  drawSpark($("spT"), liveHist.T); drawSpark($("spH"), liveHist.H); drawSpark($("spC"), liveHist.C);
}

async function toggleLive() {
  if (running === "live") { stopReq = true; return; }
  running = "live"; stopReq = false;
  setBusy(true, $("liveBtn"));
  showMessage("");
  render();
  try {
    while (!stopReq) {
      const started = Date.now();
      const m = await dev.request("measure");
      const tv = info.corr.apply("temp", m.temp_C), hv = info.corr.apply("hum", m.hum_pct);
      const cv = m.co2_ppm === null ? null : info.corr.apply("co2", m.co2_ppm);
      $("lvT").textContent = tv.toFixed(2);
      $("lvH").textContent = hv.toFixed(2);
      $("lvC").textContent = cv === null ? "—" : String(cv);
      liveHist.T.push(tv); liveHist.H.push(hv); if (cv !== null) liveHist.C.push(cv);
      for (const k of ["T", "H", "C"]) if (liveHist[k].length > LIVE_KEEP) liveHist[k].shift();
      drawSparks();
      info.now = m;
      const wait = 1000 - (Date.now() - started);
      if (wait > 0 && !stopReq) await sleep(wait);
    }
  } catch (e) {
    showMessage(t("live_failed", { e: errText(e) }), "warn");
  }
  if (!dev || await dropIfLost()) return;
  running = null;
  setBusy(false);
  render();
}

// ------------------------------------------------------------
// 校正 (補正係数、CO2 の強制校正)
// ------------------------------------------------------------
async function saveCorrection(reset) {
  let params;
  if (reset) {
    params = { temp: { a: 1, b: 0 }, hum: { a: 1, b: 0 }, co2: { a: 1, b: 0 } };
  } else {
    const num = (id) => Number($(id).value);
    params = {
      temp: { a: num("cTa"), b: num("cTb") }, hum: { a: num("cHa"), b: num("cHb") }, co2: { a: num("cCa"), b: num("cCb") },
    };
    const limit = { temp: 5, hum: 15, co2: 2000 };
    for (const k in params) {
      const { a, b } = params[k];
      if (!(a >= 0.8 && a <= 1.2) || !(Math.abs(b) <= limit[k])) { showMessage(t("corr_bad"), "warn"); return; }
      params[k] = { a: Number(a.toFixed(5)), b: Number(b.toFixed(2)) };
    }
  }
  setBusy(true);
  try {
    info.corr = makeCorrection(await dev.request("set_correction", params));
    fillCorrectionInputs();
    renderInfo();
    showMessage(t("corr_saved"), "ok");
  } catch (e) {
    showMessage(t("corr_failed", { e: errText(e) }), "warn");
    if (await dropIfLost()) return;
  }
  setBusy(false);
}

async function toggleFrc() {
  if (running === "frc") { stopReq = true; return; }
  const ppm = Number($("frcPpm").value);
  if (!Number.isInteger(ppm) || ppm < 300 || ppm > 5000) { showMessage(t("frc_bad"), "warn"); return; }
  if (!confirm(t("frc_confirm", { p: ppm }))) return;

  running = "frc"; stopReq = false;
  setBusy(true, $("frcBtn"));
  showMessage("");
  render();
  const prog = $("frcProg"), out = $("frcResult");
  prog.max = FRC_SAMPLES; prog.value = 0; prog.hidden = false; out.hidden = false; out.textContent = "";
  try {
    let stopped = false;
    for (let i = 1; i <= FRC_SAMPLES; i++) {
      if (stopReq) { stopped = true; break; }
      const m = await dev.request("measure");
      if (m.co2_ppm === null) throw new DeviceError(t("e_no_co2_sensor"), "no_co2_sensor");
      prog.value = i;
      out.textContent = t("frc_progress", { i, n: FRC_SAMPLES, c: m.co2_ppm });
    }
    if (stopped) {
      out.textContent = t("frc_stopped");
    } else {
      const r = await dev.request("co2_frc", { ppm });
      out.textContent = t("frc_done", { p: r.ppm, c: signed(r.correction, 0) });
    }
  } catch (e) {
    out.hidden = true;
    showMessage(t("frc_failed", { e: errText(e) }), "warn");
  }
  prog.hidden = true;
  if (!dev || await dropIfLost()) return;
  running = null;
  setBusy(false);
  render();
}

// ------------------------------------------------------------
// 時計の補正
// ------------------------------------------------------------
async function toggleClock() {
  if (running === "clock") { stopReq = true; return; }
  const duration = Number($("clockMin").value) * 60, STEP = 10;
  running = "clock"; stopReq = false; clockNew = null;
  setBusy(true, $("clockBtn"));
  showMessage("");
  render();
  const prog = $("clockProg"), out = $("clockResult");
  prog.max = duration; prog.value = 0; prog.hidden = false; out.hidden = false; out.textContent = "";
  try {
    const pts = [];
    const tStart = nowSec();
    for (;;) {
      pts.push(await dev.epochTransition());
      const elapsed = pts[pts.length - 1][1] - pts[0][1];
      const est = pts.length >= 3 ? signed(fitPpm(pts)[0], 1) + " ppm" : "—";
      prog.value = Math.min(duration, elapsed);
      out.textContent = t("clock_progress", { a: (elapsed / 60).toFixed(1), b: (duration / 60).toFixed(0), p: est });
      if (nowSec() - tStart >= duration || stopReq) break;
      // 次の点まで待つ (中止にすぐ応えられるよう細かく区切る)
      const until = Date.now() + (STEP - 1.2) * 1000;
      while (Date.now() < until && !stopReq) await sleep(200);
    }
    if (pts.length < 3) {
      out.textContent = t("clock_short");
    } else {
      const [ppm, err] = fitPpm(pts);
      const cur = info.clockPpm || 0;
      clockNew = Math.max(-127, Math.min(127, Math.round(cur + ppm)));
      out.textContent = t("clock_result", {
        p: signed(ppm, 2), e: err.toFixed(2), n: pts.length, m: ((pts[pts.length - 1][1] - pts[0][1]) / 60).toFixed(1),
        d: signed(ppm * 0.0864, 2), s: signed(clockNew, 0), c: signed(cur, 0),
      });
    }
  } catch (e) {
    out.hidden = true;
    showMessage(t("clock_failed", { e: errText(e) }), "warn");
  }
  prog.hidden = true;
  if (!dev || await dropIfLost()) return;
  running = null;
  setBusy(false);
  render();
}

async function setClockCalib(ppm) {
  setBusy(true);
  try {
    info.clockPpm = (await dev.request("set_clock_calib", { ppm })).ppm;
    clockNew = null;
    renderInfo();
    showMessage(t("clock_saved", { p: signed(info.clockPpm, 0) }), "ok");
  } catch (e) {
    showMessage(t("clock_failed", { e: errText(e) }), "warn");
    if (await dropIfLost()) return;
  }
  setBusy(false);
}

// ------------------------------------------------------------
// 診断
// ------------------------------------------------------------
async function runSelftest() {
  setBusy(true);
  showMessage("");
  const out = $("diagResult");
  try {
    const r = await dev.request("selftest", undefined, 10000);
    const ok = (b) => (b ? "OK" : "NG");
    const fl = r.flash, se = r.sensor;
    let val = "";
    if (se.ok) {
      const tv = info.corr.apply("temp", se.temp_C), hv = info.corr.apply("hum", se.hum_pct);
      const cv = se.co2_ppm === null ? null : info.corr.apply("co2", se.co2_ppm);
      val = `（${tv.toFixed(1)} ℃, ${hv.toFixed(1)} %` + (cv === null ? "" : `, ${cv} ppm`) + "）";
    }
    let text = t("diag_result", {
      fl: ok(fl.ok && fl.rw), j: fl.jedec, rw: ok(fl.rw), se: ok(r.sensor_i2c),
      kind: r.co2 ? t("sensor_co2") : t("sensor_th"), me: ok(se.ok), val, all: ok(r.ok),
    });
    try {
      const d = await dev.request("get_diag");
      text += t("diag_detail", { a: d.usb_errs, b: d.usb_err, c: d.wdt });
    } catch (e) { /* 古いファームウェアには無い */ }
    out.textContent = text;
    out.hidden = false;
  } catch (e) {
    out.hidden = true;
    showMessage(t("diag_failed", { e: errText(e) }), "warn");
    if (await dropIfLost()) return;
  }
  setBusy(false);
}

// ------------------------------------------------------------
// 起動
// ------------------------------------------------------------
render();
$("langBtn").addEventListener("click", () => {
  lang = lang === "ja" ? "en" : "ja";
  try { localStorage.setItem("clogger_lang", lang); } catch (e) {}
  if (!busy) showMessage("");
  render();
});

if (!("serial" in navigator)) {
  $("unsupported").hidden = false;
  $("connectBox").hidden = true;
} else {
  $("connectBtn").addEventListener("click", async () => {
    if (busy) return;
    if (dev) { await disconnect(); showMessage(""); } else { await connect(); }
  });
  document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => { if (!busy) selectTab(b.dataset.tab); }));
  const on = (id, fn) => $(id).addEventListener("click", () => { if (dev && !busy) fn(); });
  on("startBtn", startLogging);
  on("saveBtn", saveCsv);
  on("eraseBtn", eraseData);
  on("corrSaveBtn", () => saveCorrection(false));
  on("corrResetBtn", () => saveCorrection(true));
  on("clockApplyBtn", () => { if (clockNew !== null) setClockCalib(clockNew); });
  on("clockResetBtn", () => setClockCalib(0));
  on("diagBtn", runSelftest);
  // 開始と停止を兼ねるボタンは、実行中 (busy) でも押せる
  $("liveBtn").addEventListener("click", () => { if (dev && (!busy || running === "live")) toggleLive(); });
  $("clockBtn").addEventListener("click", () => { if (dev && (!busy || running === "clock")) toggleClock(); });
  $("frcBtn").addEventListener("click", () => { if (dev && (!busy || running === "frc")) toggleFrc(); });
  $("interval").addEventListener("input", updateCapacity);
  // USB を抜かれたら切断の表示に戻す
  navigator.serial.addEventListener("disconnect", async (ev) => {
    if (dev && ev.target === dev.port) {
      const wasBusy = busy;
      await disconnect();
      if (!wasBusy) showMessage(t("unplugged"), "warn");
    }
  });
}
</script>
